name: Validate PWA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check data.js
          node --check app.js
          node --check sw.js
          node tests/smoke.js

      - name: Validate manifest
        run: python -m json.tool manifest.webmanifest > /dev/null

      - name: Verify app shell files
        run: |
          test -f index.html
          test -f styles.css
          test -f icon.svg
          grep -q 'data.js' index.html
          grep -q 'app.js' index.html
